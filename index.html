<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #1B2B6B;
    --navy-dk: #131f50;
    --blue:    #2D7CC7;
    --blue-lt: #E8F2FB;
    --sky:     #5BB3E4;
    --white:   #FFFFFF;
    --cream:   #F4F7FB;
    --ink:     #1B2B6B;
    --muted:   #6B7A99;
    --border:  #D1DCEE;
    --radius:  16px;
    --shadow:  0 4px 32px rgba(27,43,107,.13);
    --btn-h:   72px;
  }

  html, body {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--navy);
    padding: 0 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 88px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo img {
    height: 44px;
    width: auto;
    display: block;
  }
  header .tagline {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sky);
  }

  /* Stepbar */
  #stepbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 56px;
    height: 54px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 13px;
  }
  .crumb {
    color: var(--muted);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .crumb:hover { background: var(--blue-lt); color: var(--blue); }
  .crumb.active { color: var(--navy); font-weight: 700; }
  .crumb-sep { color: var(--border); }

  /* Content */
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 44px 56px calc(var(--btn-h) + 24px);
    scroll-behavior: smooth;
  }

  .screen-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
    color: var(--navy);
    letter-spacing: -.5px;
  }
  .screen-subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 36px;
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card-grid.centered {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
  }
  .card-grid.centered .option-card {
    width: 280px;
    flex-shrink: 0;
  }
  .option-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .option-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--blue);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform .25s ease;
  }
  .option-card:hover, .option-card:active, .option-card.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-3px); }
  .option-card:hover::before, .option-card:active::before, .option-card.touched::before { transform: scaleY(1); }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon svg { width: 24px; height: 24px; stroke: var(--blue); fill: none; }
  .card-icon svg[viewBox="0 0 506 506"] { stroke: none; fill: var(--blue); width: 28px; height: 28px; }
  .card-icon:has(svg[viewBox="0 0 506 506"]) { background: var(--blue-lt); }
  .card-label { font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--navy); }
  .card-meta { font-size: 13px; color: var(--muted); font-weight: 500; }
  .card-arrow {
    margin-top: auto;
    width: 32px; height: 32px;
    background: var(--blue-lt);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .option-card:hover .card-arrow, .option-card:active .card-arrow, .option-card.touched .card-arrow { background: var(--blue); }
  .card-arrow svg { width: 16px; height: 16px; stroke: var(--blue); transition: stroke .2s; }
  .option-card:hover .card-arrow svg, .option-card:active .card-arrow svg, .option-card.touched .card-arrow svg { stroke: #fff; }

  /* Job list */
  .job-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .job-row {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .job-row:hover, .job-row:active, .job-row.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateX(4px); }
  .job-row-body { flex: 1; }
  .job-title { font-size: 19px; font-weight: 700; margin-bottom: 3px; color: var(--navy); }
  .job-clinic { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .job-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .7px;
    text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
  }
  .badge-blue { background: var(--blue-lt); color: var(--blue); }
  .badge-navy { background: #E8EBF5; color: var(--navy); }
  .badge-gray { background: #F3F4F6; color: var(--muted); }

  .job-row-arrow {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
  }
  .job-row:hover .job-row-arrow, .job-row:active .job-row-arrow, .job-row.touched .job-row-arrow { background: var(--blue); }
  .job-row-arrow svg { width: 18px; height: 18px; stroke: var(--blue); transition: stroke .2s; }
  .job-row:hover .job-row-arrow svg, .job-row:active .job-row-arrow svg, .job-row.touched .job-row-arrow svg { stroke: #fff; }

  /* Detail */
  #detail-view { max-width: 1100px; margin: 0 auto; }
  .detail-body {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  .detail-body-left { flex: 1; min-width: 0; }
  .detail-body-right {
    flex-shrink: 0;
    width: 280px;
    position: sticky;
    top: 0;
  }
  .qr-card {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: var(--white);
    text-align: center;
  }
  .qr-card h3 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 7px; }
  .qr-card p { font-size: 13px; opacity: .75; line-height: 1.65; font-weight: 400; }
  .qr-card .qr-url { font-size: 10px; opacity: .45; word-break: break-all; font-family: monospace; }
  .detail-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
  .detail-clinic-icon {
    width: 64px; height: 64px;
    background: var(--navy);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .detail-clinic-icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; }
  .detail-clinic-icon svg[viewBox="0 0 506 506"] { fill: currentColor; stroke: none; }
  .detail-title { font-size: 32px; font-weight: 800; line-height: 1.1; margin-bottom: 4px; color: var(--navy); letter-spacing: -.5px; }
  .detail-clinic-name { font-size: 15px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }
  .detail-fact { background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .detail-fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .detail-fact-value { font-size: 15px; font-weight: 700; color: var(--navy); }

  .detail-section { margin-bottom: 24px; }
  .detail-section-title { font-size: 15px; text-transform: uppercase; color: #374151; font-weight: 700; margin-bottom: 10px; }
  .detail-section p { font-size: 15px; line-height: 1.75; color: #374151; font-weight: 400; }
  .desc { font-size: 15px; line-height: 1.75; color: #374151; }
  .desc-sec { margin-top: 18px; }
  .desc-sec strong { display: block; font-size: 15px; color: #374151; font-weight: 700; margin-bottom: 6px; }
  .desc-sec:has(.desc-body:empty) { display: none; }

  /* QR */
  .qr-section {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 32px 36px;
    display: flex; align-items: center; gap: 36px;
    margin-top: 36px; color: var(--white);
  }
  #qr-canvas { background: #fff; border-radius: 10px; padding: 10px; flex-shrink: 0; }
  #qr-canvas img, #qr-canvas canvas { display: block; }
  .qr-text h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.3px; }
  .qr-text p { font-size: 14px; opacity: .75; line-height: 1.65; max-width: 320px; font-weight: 400; }
  .qr-url { margin-top: 14px; font-size: 11px; opacity: .5; word-break: break-all; font-family: monospace; }

  /* Back button */
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 2px solid var(--border);
    padding: 10px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
    margin-bottom: 32px;
    font-family: 'Montserrat', sans-serif;
    color: var(--navy); letter-spacing: .3px;
  }
  .back-btn:hover, .back-btn:active, .back-btn.touched { border-color: var(--blue); background: var(--blue-lt); color: var(--blue); }
  .back-btn svg { width: 15px; height: 15px; stroke: currentColor; }

  /* Sticky Start Over bar */
  #start-over-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--btn-h);
    background: var(--white);
    border-top: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #start-over-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 0 56px;
    height: 48px;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background .2s, transform .1s;
  }
  #start-over-btn:hover, #start-over-btn:active, #start-over-btn.touched { background: var(--blue); transform: scale(1.02); }
  #start-over-btn:active { transform: scale(.98); }
  #start-over-btn svg { width: 15px; height: 15px; stroke: #fff; }

  /* Idle screen */
  #idle-overlay {
    position: fixed; inset: 0; z-index: 100;
    background-image: url('bg.webp');
    background-size: cover;
    background-position: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; cursor: pointer;
    transition: opacity .4s;
  }
  #idle-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--navy);
    opacity: 0.8;
    z-index: 0;
  }
  #idle-overlay > * { position: relative; z-index: 1; }
  #idle-overlay > .idle-logo { position: absolute; top: 0; left: 0; right: 0; z-index: 102; }
  #idle-overlay.hidden { opacity: 0; pointer-events: none; }
  .idle-logo { width: 100%; padding: 32px 32px 0; display: flex; justify-content: center; }
  .idle-logo img { height: 100px; display: block; }
  .idle-tagline { font-size: 26px; color: var(--sky); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-top: 40px; text-align: center; }
  .idle-kiosk-title { display: block; font-size: 100px; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1.1; margin-bottom: 12px; text-transform: none; letter-spacing: -.5px; }
  .idle-cta {
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.3);
    color: #fff;
    padding: 18px 52px;
    border-radius: 50px;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    animation: pulse 2.5s ease-in-out infinite;
    text-transform: uppercase;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:1; }
    50% { transform: scale(1.03); opacity:.8; }
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .anim { animation: fadeUp .3s ease both; }
  .anim-d1 { animation-delay: .05s; }
  .anim-d2 { animation-delay: .10s; }
  .anim-d3 { animation-delay: .15s; }
  .anim-d4 { animation-delay: .20s; }
  .anim-d5 { animation-delay: .25s; }

  #content::-webkit-scrollbar { width: 5px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Mobile (max 767px) ── */
  @media (max-width: 767px) {
    html, body { overflow: auto; }
    #app { height: auto; min-height: 100vh; overflow: visible; }

    header {
      padding: 0 20px;
      height: 64px;
    }
    .logo img { height: 32px; }
    header .tagline { font-size: 10px; letter-spacing: 1.5px; }

    #stepbar {
      padding: 0 20px;
      height: auto;
      min-height: 44px;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 8px;
      padding-bottom: 8px;
      font-size: 12px;
    }

    #content {
      padding: 24px 20px calc(var(--btn-h) + 20px);
      overflow-y: visible;
      flex: none;
    }

    .screen-title { font-size: 24px; }
    .screen-subtitle { font-size: 13px; margin-bottom: 24px; }

    .card-grid {
      grid-template-columns: 1fr;
    }
    .card-grid.centered {
      flex-direction: column;
      align-items: stretch;
    }
    .card-grid.centered .option-card {
      width: 100%;
    }

    .job-list {
      grid-template-columns: 1fr;
    }
    .job-row { padding: 16px 18px; }
    .job-title { font-size: 16px; }

    .detail-body {
      flex-direction: column;
      gap: 24px;
    }
    .detail-body-right {
      width: 100%;
      position: static;
    }
    .detail-title { font-size: 22px; }
    .detail-header { gap: 14px; }
    .detail-clinic-icon { width: 48px; height: 48px; border-radius: 10px; }
    .detail-clinic-icon svg { width: 24px; height: 24px; }

    .detail-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    #start-over-btn { padding: 0 32px; font-size: 12px; }

    #idle-overlay { justify-content: center; }
    .idle-logo { padding: 24px 32px 0; }
    .idle-logo img { max-width: 280px; height: 80px; width: auto; }
    .idle-tagline .interpunct { display: none; }
    .idle-tagline { margin-top: 0; }
    .idle-kiosk-title { font-size: 40px; margin-bottom: 8px; }
    #idle-overlay .idle-cta { font-size: 13px; padding: 14px 32px; width: auto; text-align: center; max-width: 280px; line-height: 1.5; position: fixed !important; bottom: 40px; left: 0; right: 0; margin: 0 auto; z-index: 103; }
  }

  /* ── Desktop (1024px+) ── */
  @media (min-width: 1024px) {
    .idle-logo img { height: 130px; }
    .idle-kiosk-title { font-size: 135px; }
  }
</style>
</head>

ey representative of 123Dentist in the market, helping shape how the organization grows and expands its footprint. This is a highly autonomous role suited to someone who thrives in a fast-paced environment, is commercially driven, and is comfortable operating at both strategic and relationship levels.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Identify, engage, and develop new dental practice partnership opportunities across the territory<br>&bull; Manage the early and mid-stages of the acquisition lifecycle, from initial outreach through evaluation and deal progression<br>&bull; Build and maintain strong relationships with key referral partners including accountants, legal advisors, and wealth managers<br>&bull; Partner closely with Corporate<br>&bull; Development to assess opportunities and support investment recommendations<br>&bull; Develop and execute territory-based growth strategies aligned with national expansion priorities<br>&bull; Represent 123Dentist in meetings with dentists, practice owners, and senior stakeholders<br>&bull; Maintain active market intelligence, tracking competitors, trends, and emerging opportunities<br>&bull; Coordinate with internal teams to ensure smooth transition from deal sourcing to execution<br>&bull; Travel regularly within Alberta and surrounding regions to support relationship building and opportunity development.</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bull; 7–8 years of experience in business development, partnerships, or commercial growth roles<br>&bull; Experience in healthcare, dental, or multi-site service environments is strongly preferred<br>&bull; Proven track record of managing territory-based growth strategies<br>&bull; Strong network within the dental or professional services community is an asset<br>&bull; University degree in Business or related field<br>&bull; Strong financial and analytical capability, i   {posting:11294,clinic:"",title:"Manager, Financial Planning and Analysis",category:"Planning & Analysis",status:"FT",city:"Toronto",province:"ON",salary:"90000.00 To 135000.00 (CAD) Annually",date:"May 6, 2026",description:"Job Title: Manager, Financial Planning &amp; Analysis – Value Creation Team: Finance Reports To: Director, Financial Planning and Strategic Analytics Location: Toronto (4 days Onsite, 1 Day Remote)<div class=\"desc-sec\"><strong>EMPLOYMENT TYPE</strong><div class=\"desc-body\">Permanent Full-Time</div></div><div class=\"desc-sec\"><strong>ABOUT 123DENTIST</strong><div class=\"desc-body\">At 123Dentist, we’re redefining the future of dental care across Canada by empowering clinics with innovative technology, data-driven insights, and operational excellence. Our growing network of practices relies on strong digital infrastructure—and that’s where you come in.</div></div><div class=\"desc-sec\"><strong>ABOUT THE ROLE</strong><div class=\"desc-body\">This isn’t a traditional FP&amp;A role. As Manager, Financial Planning &amp; Analysis – Value Creation, you’ll sit at the intersection of finance, strategy, and operations—partnering closely with senior leaders to shape how the business grows and where it invests. You’ll go beyond reporting the numbers to interpreting what they mean, challenging assumptions, and helping leaders make better decisions. Whether it’s evaluating investments, tracking value creation initiatives, or building forward-looking models, your work will directly influence the direction of the organization. Your work will help answer some of the organization’s most important questions: Where should we invest? What’s driving performance? What needs to change? If you’re someone who enjoys connecting the dots, asking “why,” and turning complexity into clarity, this role is built for you.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Lead budgeting and forecasting cycles, aligning inputs across teams into a unified financial view<br>&bull; Drive long-range and strategic planning, translating priorities into measurable financial outcomes<br>&bull; Own value creation tracking, ensuring initiatives deliver expected<br>&bull; ROI and surfacing risks early<br>&bull; Conduct investment and capital allocation analysis (DCF, NPV, sensitivity modeling) to support strategic decisions<br>&bull; Deliver variance and performance insights, identifying drivers and recommending actionable next steps<br>&bull; Partner with operational leaders to embed financial thinking into decision-making<br>&bull; Build executive and board-level materials that clearly tell the story behind the numbers<br>&bull; Enhance and maintain<br>&bull; Power BI dashboards to provide real-time visibility into performance<br>&bull; Apply predictive analytics and modern tools (Python, R, AI/LLMs) to generate forward-looking insights</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bull; 8+ years of experience in FP&amp;A,<br>&bull; Corporate Development,<br>&bull; Management Consulting, or Strategic<br>&bull; Analytics A degree in Finance,<br>&bull; Economics, or a quantitative field;<br>&bull; MBA, CPA, or CFA is required<br>&bull; Advanced financial modeling skills—you’re comfortable building dynamic models from scratch<br>&bull; Strong proficiency in Excel,<br>&bull; Power BI (DAX/Power Query), and SQL; experience with Workday<br>&bull; Adaptive is an asset<br>&bull; Familiarity with Python,<br>&bull; R, or AI tools for deeper analysis and forecasting<br>&bull; You think like an owner.<br>&bull; You care about how the numbers are built, what they mean, and how they’re used<br>&bull; You’re comfortable operating at both the detail level and the strategic level without losing momentum<br>&bull; You can translate complex analysis into clear, compelling narratives for senior leaders and Board audiences<br>&bull; You build strong relationships and can influence decisions without direct authority<br>&bull; You have a strong instinct for what truly drives business performance, not just what shows up in reports<br>&bull; What Sets You<br>&bull; Apart You go beyond reporting numbers, you help shape decisions.<br>&bull; You naturally look past the “what” to understand the “why,” and you turn complex financial data into clear, actionable insights that drive strategy and investment decisions.<br>&bull; You bring strong technical<br>&bull; FP&amp;A capability paired with a strategic, owner’s mindset.<br>&bull; You’re just as comfortable building detailed financial models as you are stepping back to connect insights to broader business priorities.<br>&bull; Known for your clarity and influence, you communicate effectively with senior leaders, challenge assumptions constructively, and help move decisions forward.<br>&bull; You thrive in environments where finance is a true partner to the business and where your work directly impacts value creation.</div></div><div class=\"desc-sec\"><strong>WHY JOIN 123DENTIST</strong><div class=\"desc-body\">? Influence enterprise-level strategy and value creation initiatives Work closely with senior leadership and decision-makers Be part of a collaborative, high-performing, and evolving Finance function Help shape a data-driven healthcare organization at scale Grow your career in an environment that values curiosity, ownership, and impact</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200869264032_1&source=CC3"},

ve operational challenges, and ensure alignment with 123Dentist standards and the Operational Playbook. This is a highly visible, field-based leadership role that requires strong business acumen, independent decision-making, and the ability to influence multiple stakeholders in a fast-paced, multi-site environment.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Own regional clinic performance, including revenue growth, profitability, patient flow, and cost management across your portfolio<br>&bull; Conduct regular clinic reviews, financial analysis, and operational audits to identify gaps and drive performance improvements<br>&bull; Ensure all clinics are operating in alignment with 123Dentist standards, policies, and the Operational<br>&bull; Playbook Provide hands-on leadership support to Office<br>&bull; Managers and clinic teams to improve execution, efficiency, and accountability<br>&bull; Act as the primary liaison between corporate and clinic teams, reinforcing priorities, culture, and operational expectations<br>&bull; Spend significant time in the field, visiting clinics to coach leaders, resolve operational issues, and support team development<br>&bull; Partner with HR and Talent<br>&bull; Acquisition to support recruitment, onboarding, retention, and employee relations processes<br>&bull; Collaborate with Finance,<br>&bull; HR, Marketing, and other internal teams to implement initiatives and resolve operational challenges<br>&bull; Monitor and manage key performance indicators (KPIs) across clinics, identifying trends, risks, and opportunities for improvement<br>&bull; Support Office<br>&bull; Managers in developing high-performing teams and building strong clinic-level leadership capability<br>&bull; Provide regular reporting, insights, and updates to the Director of Operations on regional performance and initiatives<br>&bull; Identify and implement opportunities for operational improvement, scalability, and consistency across clinics.</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bull; 5–8 years of progressive leadership experience in multi-site operations, healthcare, retail, or service-based environments<br>&bull; Proven experience managing multiple locations with accountability for financial and operational performance (P&amp;L exposure required)<br>&bull; Strong leadership and coaching skills with the ability to influence teams without direct authority<br>&bull; Comfortable working in a field-based role with frequent travel between clinic locations<br>&bull; Strong business acumen with the ability to interpret financial and operational data to drive decisions<br>&bull; Excellent communication, relationship-building, and stakeholder management skills<br>&bull; Highly organized, adaptable, and comfortable managing competing priorities across multiple sites<br>&bull; Proficiency in Microsoft<br>&bull; Office (especially Excel) and experience working with operational dashboards or KPI reporting tools<br>&bull; Experience in dental, healthcare, or multi-site service operations is considered a strong asset</div></div><div class=\"desc-sec\"><strong>WHY JOIN 123DENTIST</strong><div class=\"desc-body\">? Be part of one of Canada’s largest and fastest-growing dental support organizations Play a key leadership role in shaping operational performance across a multi-province clinic network Work in a high-impact, field-based role with significant visibility and influence Opportunity to directly impact clinic success, patient experience, and team performance at scale Collaborative environment with strong cross-functional support and national resources</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200870697675_1&source=CC3"},

  {posting:9926,clinic:"Victoria, BC - 9926",title:"Office Manager",category:"Clinic Management",status:"FT",city:"Victoria",province:"BC",salary:"78000.00 To 90000.00 (CAD) Annually",date:"May 6, 2026",description:"Dental Office Manager – Busy, Family-Oriented Clinic in Beautiful Victoria, BC Full-Time Position | Leadership Role | Join a Positive, Patient-Focused Team Are you an energetic, organized, and inspiring leader who thrives in a fast-paced environment? Do you love building strong teams and creating exceptional experiences for patients of all ages? If so, this is the perfect opportunity for you! 🦷<div class=\"desc-sec\"><strong>ABOUT US</strong><div class=\"desc-body\">We are a busy, family-oriented dental clinic located in a vibrant area of Victoria, serving a loyal and growing patient base. Our team takes pride in providing outstanding customer service and compassionate dental care in a friendly, welcoming atmosphere. We’re looking for an experienced Dental Office Manager who can lead with confidence, organization, and positivity. 💼</div></div><div class=\"desc-sec\"><strong>ABOUT THE ROLE</strong><div class=\"desc-body\">As our Dental Office Manager , you’ll be the driving force behind our clinic’s success. You’ll oversee daily operations, support and motivate our team, and ensure every patient’s experience is smooth, efficient, and enjoyable. Your leadership will set the tone for excellence, teamwork, and genuine care. 💰</div></div><div class=\"desc-sec\"><strong>COMPENSATION</strong><div class=\"desc-body\">78,000.00 - 90,000.00 Annual Salary, with a 25k bonus available based on tenure and performance! 📅</div></div><div class=\"desc-sec\"><strong>SCHEDULE</strong><div class=\"desc-body\">Monday to Friday, with flexibility to work weekends or accommodate your availability. ✨</div></div><div class=\"desc-sec\"><strong>KEY RESPONSIBILITIES</strong><div class=\"desc-body\">&bull; Lead, coach, and inspire a talented administrative and clinical team<br>&bull  all candidates for their interest; however, only those selected for an interview will be contacted.</div></div><div class=\"desc-sec\"><strong>JOB ID</strong><div class=\"desc-body\">9926OM-2-CFD</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200829613835_1&source=CC3"}
];

const STATUS_LABELS = { FT:"Full-Time", PT:"Part-Time", "FT/PT":"Full-Time / Part-Time", "Temp FT":"Temp Full-Time", "Temp PT":"Temp Part-Time", "Temp FT/PT":"Temp Full-Time / Part-Time", Locum:"Locum", Casual:"Casual", "PT 20+":"PT (20+ hrs/wk)", "PT <20":"PT (<20 hrs/wk)" };
const PROVINCE_NAMES = { ON:"Ontario", QC:"Quebec", BC:"British Columbia", AB:"Alberta", MB:"Manitoba", SK:"Saskatchewan", NS:"Nova Scotia", NB:"New Brunswick", NL:"Newfoundland", PE:"Prince Edward Island" };

const locationMap = {};
RAW_JOBS.forEach(j => {
  const key = j.province;
  if (!locationMap[key]) locationMap[key] = { province: j.province, jobs: [] };
  locationMap[key].jobs.push(j);
});

let state = { step:'location', location:null, category:null };

8 185.424011 C 167.598999 184.960999 173.904007 185.161987 180.218002 185.942017 C 186.533005 186.721008 192.703995 188.049011 198.766998 190.059021 C 204.811996 192.001007 210.576996 194.526978 216.197998 197.601013 L 203.703995 220.13501 C 199.612 217.886993 195.322006 215.984009 190.802002 214.578003 C 186.350006 213.153992 181.785995 212.122986 177.059006 211.572021 C 172.399994 211.002991 167.714005 210.877014 163.001999 211.194 C 158.289993 211.510986 153.705002 212.302979 149.160995 213.52002 C 144.617004 214.737 140.25 216.343018 136.011002 218.423004 C 131.770996 220.502991 127.776001 222.953979 124.026001 225.776001 C 120.276001 228.596985 116.837997 231.770996 113.626999 235.247986 C 110.484001 238.705994 107.721001 242.498993 105.234001 246.507996 L 83.141998 233.237 L 83.277603 233.200989 Z M 187.384995 9.587097 C 52.633598 45.67749 -27.405899 183.912994 8.62372 318.317993 C 44.6534 452.721985 183.136002 532.504028 317.888 496.412994 C 452.639008 460.322998 532.677979 322.087006 496.631012 187.61499 C 460.583008 53.1427 322.135986 -26.503296 187.384995 9.587097 Z"/></svg>`;
const iconChevron = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
const iconArrowLeft = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`;

function updateBreadcrumb() {
  const cL=document.getElementById('crumb-location'), cC=document.getElementById('crumb-category'), cJ=document.getElementById('crumb-job');
  const s1=document.getElementById('sep1'), s2=document.getElementById('sep2');
  cL.className='crumb'+(state.step==='location'?' active':'');
  if(state.location){
    s1.style.display=''; cC.style.display='';
    cC.textContent=`${PROVINCE_NAMES[state.location.province]||state.location.province}`;
    cC.className='crumb'+(state.step==='category'?' active':'');
    cC.onclick=()=>renderCategory();
  } else { s1.style.display='none'; cC.style.display='none'; }
  if(state.category){
    s2.style.display=''; cJ.style.display='';
    cJ.textContent=state.category;
    cJ.className='crumb'+(state.step==='jobs'?' active':'');
    cJ.onclick=()=>renderJobs();
  } else { s2.style.display='none'; cJ.style.display='none'; }
}

function renderLocation() {
  state={step:'location',location:null,category:null};
  updateBreadcrumb();
  gtag('event', 'search_started', { event_category: 'Kiosk', event_label: 'Where would you like to work?' });
  const locations=Object.values(locationMap).sort((a,b)=>(PROVINCE_NAMES[a.province]||a.province).localeCompare(PROVINCE_NAMES[b.province]||b.province));
  const c=document.getElementById('content');
  c.scrollTop=0;
  c.innerHTML=`
    <div class="anim"><div class="screen-title">Where would you like to work?</div><div class="screen-subtitle">Select a province to explore available positions.</div></div>
    <div class="card-grid">
      ${locations.map((loc,i)=>`
        <div class="option-card anim anim-d${Math.min(i+1,5)}" onclick="selectLocation('${loc.province}')">
          <div class="card-icon">${iconPin}</div>
          <div class="card-label">${PROVINCE_NAMES[loc.province]||loc.province}</div>
          <div class="card-meta">${loc.jobs.length} opening${loc.jobs.length!==1?'s':''}</div>
          <div class="card-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function selectLocation(key){
  state.location=locationMap[key];
  gtag('event', 'province_selected', { event_category: 'Kiosk', event_label: PROVINCE_NAMES[key] || key });
  renderCategory();
}

function renderCategory() {
  state.step='category'; state.category=null;
  updateBreadcrumb();
  const cats={};
  state.location.jobs.forEach(j=>{ const c=j.category.trim(); if(!cats[c])cats[c]=0; cats[c]++; });
  const catIcon=c=>(['Associate Dentist','Hygienist','Dental Assistant','Dental Specialist'].includes(c))?iconHospital:iconBriefcase;
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderLocation()">${iconArrowLeft} All Provinces</button>
    <div class="anim anim-d1"><div class="screen-title">What type of role?</div><div class="screen-subtitle">Positions in <strong>${PROVINCE_NAMES[state.location.province]||state.location.province}</strong></div></div>
    <div class="card-grid centered">
      ${Object.entries(cats).map(([cat,count],i)=>`
        <div class="option-card anim anim-d${Math.min(i+2,5)}" onclick="selectCategory('${cat.replace(/'/g,"\\'")}')">
          <div class="card-icon">${catIcon(cat)}</div>
          <div class="card-label">${cat}</div>
          <div class="card-meta">${count} opening${count!==1?'s':''}</div>
          <div class="card-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function selectCategory(cat){
  state.category=cat;
  gtag('event', 'role_type_selected', { event_category: 'Kiosk', event_label: cat });
  renderJobs();
}

function renderJobs() {
  state.step='jobs';
  updateBreadcrumb();
  const jobs=state.location.jobs.filter(j=>j.category.trim()===state.category.trim());
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderCategory()">${iconArrowLeft} Back</button>
    <div class="anim anim-d1"><div class="screen-title">${state.category}</div><div class="screen-subtitle">${jobs.length} opening${jobs.length!==1?'s':''} in ${PROVINCE_NAMES[state.location.province]||state.location.province}</div></div>
    <div class="job-list">
      ${jobs.map((job,i)=>`
        <div class="job-row anim anim-d${Math.min(i+2,5)}" onclick="renderJobDetail(${RAW_JOBS.indexOf(job)})">
          <div class="job-row-body">
            <div class="job-title">${job.title}</div>
            <div class="job-clinic">${job.clinic}</div>
            <div class="job-badges">
              ${job.status?`<span class="badge badge-blue">${STATUS_LABELS[job.status]||job.status}</span>`:''}
              <span class="badge badge-navy">${job.city}, ${job.province}</span>
            </div>
          </div>
          <div class="job-row-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function renderJobDetail(idx) {
  const job=RAW_JOBS[idx];
  gtag('event', 'job_viewed', { event_category: 'Kiosk', event_label: `${job.title} – ${job.clinic}`, job_title: job.title, clinic: job.clinic, province: job.province, posting: job.posting });
  state.step='detail';
  updateBreadcrumb();
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderJobs()">${iconArrowLeft} Back to Listings</button>
    <div id="detail-view">
      <div class="detail-header anim">
        <div class="detail-clinic-icon">${['Associate Dentist','Hygienist','Dental Assistant','Dental Specialist'].includes(job.category.trim()) ? iconHospital : iconBriefcase}</div>
        <div>
          <div class="detail-title">${job.title} – ${job.clinic}</div>
          <div class="job-badges">
            ${job.status?`<span class="badge badge-blue">${STATUS_LABELS[job.status]||job.status}</span>`:''}
            <span class="badge badge-navy">Posting #${job.posting}</span>
          </div>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-body-left">
          <div class="detail-grid anim anim-d1">
            <div class="detail-fact"><div class="detail-fact-label">Location</div><div class="detail-fact-value">${job.city}, ${job.province}</div></div>
            ${job.status?`<div class="detail-fact"><div class="detail-fact-label">Employment Type</div><div class="detail-fact-value">${STATUS_LABELS[job.status]||job.status}</div></div>`:''}
            ${job.salary?`<div class="detail-fact"><div class="detail-fact-label">Salary</div><div class="detail-fact-value">${job.salary}</div></div>`:''}
            <div class="detail-fact"><div class="detail-fact-label">Category</div><div class="detail-fact-value">${job.category.trim()}</div></div>
          </div>
          ${job.description ? `<div class="detail-section anim anim-d2">
            <div class="detail-section-title">About this role</div>
            <div class="desc">${job.description}</div>
          </div>` : ''}
        </div>
        <div class="detail-body-right anim anim-d2">
          <div class="qr-card">
            <div id="qr-canvas"></div>
            <div>
              <h3>Apply for this position</h3>
              <p>Scan with your phone to view the full listing and submit your application.</p>
              <div class="qr-url">${job.url}</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{
    new QRCode(document.getElementById("qr-canvas"),{
      text:job.url, width:160, height:160,
      colorDark:"#1B2B6B", colorLight:"#ffffff",
      correctLevel:QRCode.CorrectLevel.M
    });
  },50);
}

function goHome(){ renderLocation(); }
function startOver(){ renderLocation(); }
function showIdle(){ renderLocation(); idle.classList.remove('hidden'); }

const idle=document.getElementById('idle-overlay');
idle.addEventListener('click',()=>{ idle.classList.add('hidden'); resetIdleTimer(); });

let idleTimer;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(showIdle,30000);
}
['touchstart','click','mousemove','keydown'].forEach(e=>{
  document.addEventListener(e,resetIdleTimer,{passive:true});
});
resetIdleTimer();

// Header tap → go to idle screen
document.querySelector('header').addEventListener('click', function(e){
  e.stopPropagation();
  renderLocation();
  idle.classList.remove('hidden');
});
document.querySelector('header').addEventListener('touchstart', function(e){
  e.stopPropagation();
}, {passive:true});

// Touch feedback for Chrome kiosk — adds .touched class on press, removes on release
document.addEventListener('touchstart', function(e) {
  const el = e.target.closest('.option-card, .job-row, .back-btn, #start-over-btn');
  if (el) el.classList.add('touched');
}, {passive: true});
document.addEventListener('touchend', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});
document.addEventListener('touchcancel', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});

renderLocation();
</script>
