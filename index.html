<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #1B2B6B;
    --navy-dk: #131f50;
    --blue:    #2D7CC7;
    --blue-lt: #E8F2FB;
    --sky:     #5BB3E4;
    --white:   #FFFFFF;
    --cream:   #F4F7FB;
    --ink:     #1B2B6B;
    --muted:   #6B7A99;
    --border:  #D1DCEE;
    --radius:  16px;
    --shadow:  0 4px 32px rgba(27,43,107,.13);
    --btn-h:   72px;
  }

  html, body {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--navy);
    padding: 0 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 88px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo img {
    height: 44px;
    width: auto;
    display: block;
  }
  header .tagline {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sky);
  }

  /* Stepbar */
  #stepbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 56px;
    height: 54px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 13px;
  }
  .crumb {
    color: var(--muted);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .crumb:hover { background: var(--blue-lt); color: var(--blue); }
  .crumb.active { color: var(--navy); font-weight: 700; }
  .crumb-sep { color: var(--border); }

  /* Content */
  #content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 44px 56px calc(var(--btn-h) + 24px);
    scroll-behavior: smooth;
  }
  /* Short screens sit in the middle of the area under the header.
     Taller than the area, the block keeps its height, starts at the top, and scrolls. */
  .screen-fit {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: safe center;
    width: 100%;
  }

  .screen-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
    color: var(--navy);
    letter-spacing: -.5px;
  }
  .screen-subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 36px;
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card-grid.centered {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
  }
  .card-grid.centered .option-card {
    width: 280px;
    flex-shrink: 0;
  }
  .option-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .option-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--blue);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform .25s ease;
  }
  .option-card:hover, .option-card:active, .option-card.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-3px); }
  .option-card:hover::before, .option-card:active::before, .option-card.touched::before { transform: scaleY(1); }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon svg { width: 24px; height: 24px; stroke: var(--blue); fill: none; }
  .card-icon svg[viewBox="0 0 506 506"] { stroke: none; fill: var(--blue); width: 28px; height: 28px; }
  .card-icon:has(svg[viewBox="0 0 506 506"]) { background: var(--blue-lt); }
  .card-label { font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--navy); }
  .card-meta { font-size: 13px; color: var(--muted); font-weight: 500; }
  .card-arrow {
    margin-top: auto;
    width: 32px; height: 32px;
    background: var(--blue-lt);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .option-card:hover .card-arrow, .option-card:active .card-arrow, .option-card.touched .card-arrow { background: var(--blue); }
  .card-arrow svg { width: 16px; height: 16px; stroke: var(--blue); transition: stroke .2s; }
  .option-card:hover .card-arrow svg, .option-card:active .card-arrow svg, .option-card.touched .card-arrow svg { stroke: #fff; }

  /* Job list */
  .job-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .job-row {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .job-row:hover, .job-row:active, .job-row.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateX(4px); }
  .job-row-body { flex: 1; }
  .job-title { font-size: 19px; font-weight: 700; margin-bottom: 3px; color: var(--navy); }
  .job-clinic { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .job-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .7px;
    text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
  }
  .badge-blue { background: var(--blue-lt); color: var(--blue); }
  .badge-navy { background: #E8EBF5; color: var(--navy); }
  .badge-gray { background: #F3F4F6; color: var(--muted); }

  .job-row-arrow {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
  }
  .job-row:hover .job-row-arrow, .job-row:active .job-row-arrow, .job-row.touched .job-row-arrow { background: var(--blue); }
  .job-row-arrow svg { width: 18px; height: 18px; stroke: var(--blue); transition: stroke .2s; }
  .job-row:hover .job-row-arrow svg, .job-row:active .job-row-arrow svg, .job-row.touched .job-row-arrow svg { stroke: #fff; }

  /* Detail */
  #detail-view { max-width: 1100px; margin: 0 auto; }
  .detail-body {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  .detail-body-left { flex: 1; min-width: 0; }
  .detail-body-right {
    flex-shrink: 0;
    width: 280px;
    position: sticky;
    top: 0;
  }
  .qr-card {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: var(--white);
    text-align: center;
  }
  .qr-card h3 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 7px; }
  .qr-card p { font-size: 13px; opacity: .75; line-height: 1.65; font-weight: 400; }
  .qr-card .qr-url { font-size: 10px; opacity: .45; word-break: break-all; font-family: monospace; }
  .detail-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
  .detail-clinic-icon {
    width: 64px; height: 64px;
    background: var(--navy);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .detail-clinic-icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; }
  .detail-clinic-icon svg[viewBox="0 0 506 506"] { fill: currentColor; stroke: none; }
  .detail-title { font-size: 32px; font-weight: 800; line-height: 1.1; margin-bottom: 4px; color: var(--navy); letter-spacing: -.5px; }
  .detail-clinic-name { font-size: 15px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }
  .detail-fact { background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .detail-fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .detail-fact-value { font-size: 15px; font-weight: 700; color: var(--navy); }

  .detail-section { margin-bottom: 24px; }
  .detail-section-title { font-size: 15px; text-transform: uppercase; color: #374151; font-weight: 700; margin-bottom: 10px; }
  .detail-section p { font-size: 15px; line-height: 1.75; color: #374151; font-weight: 400; }
  .desc { font-size: 15px; line-height: 1.75; color: #374151; }
  .desc-sec { margin-top: 18px; }
  .desc-sec strong { display: block; font-size: 15px; color: #374151; font-weight: 700; margin-bottom: 6px; }
  .desc-sec:has(.desc-body:empty) { display: none; }

  /* QR */
  .qr-section {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 32px 36px;
    display: flex; align-items: center; gap: 36px;
    margin-top: 36px; color: var(--white);
  }
  #qr-canvas { background: #fff; border-radius: 10px; padding: 10px; flex-shrink: 0; }
  #qr-canvas img, #qr-canvas canvas { display: block; }
  .qr-text h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.3px; }
  .qr-text p { font-size: 14px; opacity: .75; line-height: 1.65; max-width: 320px; font-weight: 400; }
  .qr-url { margin-top: 14px; font-size: 11px; opacity: .5; word-break: break-all; font-family: monospace; }

  /* Back button */
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 2px solid var(--border);
    padding: 10px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
    margin-bottom: 32px;
    font-family: 'Montserrat', sans-serif;
    color: var(--navy); letter-spacing: .3px;
  }
  .back-btn:hover, .back-btn:active, .back-btn.touched { border-color: var(--blue); background: var(--blue-lt); color: var(--blue); }
  .back-btn svg { width: 15px; height: 15px; stroke: currentColor; }

  /* Sticky Start Over bar */
  #start-over-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--btn-h);
    background: var(--white);
    border-top: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #start-over-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 0 56px;
    height: 48px;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background .2s, transform .1s;
  }
  #start-over-btn:hover, #start-over-btn:active, #start-over-btn.touched { background: var(--blue); transform: scale(1.02); }
  #start-over-btn:active { transform: scale(.98); }
  #start-over-btn svg { width: 15px; height: 15px; stroke: #fff; }

  /* Idle screen */
  #idle-overlay {
    position: fixed; inset: 0; z-index: 100;
    background-image: url('bg.webp');
    background-size: cover;
    background-position: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; cursor: pointer;
    transition: opacity .4s;
  }
  #idle-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--navy);
    opacity: 0.8;
    z-index: 0;
  }
  #idle-overlay > * { position: relative; z-index: 1; }
  #idle-overlay > .idle-logo { position: absolute; top: 0; left: 0; right: 0; z-index: 102; }
  #idle-overlay.hidden { opacity: 0; pointer-events: none; }
  .idle-logo { width: 100%; padding: 32px 32px 0; display: flex; justify-content: center; }
  .idle-logo img { height: 100px; display: block; }
  .idle-tagline { font-size: 26px; color: var(--sky); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-top: 40px; text-align: center; }
  .idle-kiosk-title { display: block; font-size: 100px; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1.1; margin-bottom: 12px; text-transform: none; letter-spacing: -.5px; }
  .idle-cta {
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.3);
    color: #fff;
    padding: 18px 52px;
    border-radius: 50px;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    animation: pulse 2.5s ease-in-out infinite;
    text-transform: uppercase;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:1; }
    50% { transform: scale(1.03); opacity:.8; }
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .anim { animation: fadeUp .3s ease both; }
  .anim-d1 { animation-delay: .05s; }
  .anim-d2 { animation-delay: .10s; }
  .anim-d3 { animation-delay: .15s; }
  .anim-d4 { animation-delay: .20s; }
  .anim-d5 { animation-delay: .25s; }

  #content::-webkit-scrollbar { width: 5px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Mobile (max 767px) ── */
  @media (max-width: 767px) {
    html, body { overflow: auto; }
    #app { height: auto; min-height: 100vh; overflow: visible; }

    header {
      padding: 0 20px;
      height: 64px;
    }
    .logo img { height: 32px; }
    header .tagline { font-size: 10px; letter-spacing: 1.5px; }

    #stepbar {
      padding: 0 20px;
      height: auto;
      min-height: 44px;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 8px;
      padding-bottom: 8px;
      font-size: 12px;
    }

    #content {
      padding: 24px 20px calc(var(--btn-h) + 20px);
      overflow-y: visible;
      flex: none;
    }

    .screen-title { font-size: 24px; }
    .screen-subtitle { font-size: 13px; margin-bottom: 24px; }

    .card-grid {
      grid-template-columns: 1fr;
    }
    .card-grid.centered {
      flex-direction: column;
      align-items: stretch;
    }
    .card-grid.centered .option-card {
      width: 100%;
    }

    .job-list {
      grid-template-columns: 1fr;
    }
    .job-row { padding: 16px 18px; }
    .job-title { font-size: 16px; }

    .detail-body {
      flex-direction: column;
      gap: 24px;
    }
    .detail-body-right {
      width: 100%;
      position: static;
    }
    .detail-title { font-size: 22px; }
    .detail-header { gap: 14px; }
    .detail-clinic-icon { width: 48px; height: 48px; border-radius: 10px; }
    .detail-clinic-icon svg { width: 24px; height: 24px; }

    .detail-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    #start-over-btn { padding: 0 32px; font-size: 12px; }

    #idle-overlay { justify-content: center; }
    .idle-logo { padding: 24px 32px 0; }
    .idle-logo img { max-width: 280px; height: 80px; width: auto; }
    .idle-tagline .interpunct { display: none; }
    .idle-tagline { margin-top: 0; }
    .idle-kiosk-title { font-size: 40px; margin-bottom: 8px; }
    #idle-overlay .idle-cta { font-size: 13px; padding: 14px 32px; width: auto; text-align: center; max-width: 280px; line-height: 1.5; position: fixed !important; bottom: 40px; left: 0; right: 0; margin: 0 auto; z-index: 103; }
  }

  /* ── Desktop (1024px+) ── */
  @media (min-width: 1024px) {
    .idle-logo img { height: 130px; }
    .idle-kiosk-title { font-size: 135px; }
  }
</style>
</head>

function updateBreadcrumb() {
  const cL=document.getElementById('crumb-location'), cC=document.getElementById('crumb-category'), cJ=document.getElementById('crumb-job');
  const s1=document.getElementById('sep1'), s2=document.getElementById('sep2');
  cL.className='crumb'+(state.step==='location'?' active':'');
  if(state.location){
    s1.style.display=''; cC.style.display='';
    cC.textContent=`${PROVINCE_NAMES[state.location.province]||state.location.province}`;
    cC.className='crumb'+(state.step==='category'?' active':'');
    cC.onclick=()=>renderCategory();
  } else { s1.style.display='none'; cC.style.display='none'; }
  if(state.category){
    s2.style.display=''; cJ.style.display='';
    cJ.textContent=state.category;
    cJ.className='crumb'+(state.step==='jobs'?' active':'');
    cJ.onclick=()=>renderJobs();
  } else { s2.style.display='none'; cJ.style.display='none'; }
}

function renderLocation() {
  state={step:'location',location:null,category:null};
  updateBreadcrumb();
  gtag('event', 'search_started', { event_category: 'Kiosk', event_label: 'Where would you like to work?' });
  const locations=Object.values(locationMap).sort((a,b)=>(PROVINCE_NAMES[a.province]||a.province).localeCompare(PROVINCE_NAMES[b.province]||b.province));
  const c=document.getElementById('content');
  c.scrollTop=0;
  c.innerHTML=`
    <div class="screen-fit">
    <div class="anim"><div class="screen-title">Where would you like to work?</div><div class="screen-subtitle">Select a province to explore available positions.</div></div>
    <div class="card-grid centered">
      ${locations.map((loc,i)=>`
        <div class="option-card anim anim-d${Math.min(i+1,5)}" onclick="selectLocation('${loc.province}')">
          <div class="card-icon">${iconPin}</div>
          <div class="card-label">${PROVINCE_NAMES[loc.province]||loc.province}</div>
          <div class="card-meta">${loc.jobs.length} opening${loc.jobs.length!==1?'s':''}</div>
          <div class="card-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>
    </div>`;
}

function selectLocation(key){
  state.location=locationMap[key];

}

function renderCategory() {
  state.step='category'; state.category=null;
  updateBreadcrumb();
  const cats={};
  state.location.jobs.forEach(j=>{ const c=j.category.trim(); if(!cats[c])cats[c]=0; cats[c]++; });
  const catIcon=c=>(['Associate Dentist','Hygienist','Dental Assistant','Dental Specialist'].includes(c))?iconHospital:iconBriefcase;
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <div class="screen-fit">
    <button class="back-btn anim" onclick="renderLocation()">${iconArrowLeft} All Provinces</button>
    <div class="anim anim-d1"><div class="screen-title">What type of role?</div><div class="screen-subtitle">Positions in <strong>${PROVINCE_NAMES[state.location.province]||state.location.province}</strong></div></div>

}

  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ renderLocation(); },90000);
}
['touchstart','click','mousemove','keydown'].forEach(e=>{
  document.addEventListener(e,resetIdleTimer,{passive:true});
});
resetIdleTimer();

// Header tap → go to idle screen
document.querySelector('header').addEventListener('click', function(e){
  e.stopPropagation();
  renderLocation();
  idle.classList.remove('hidden');
});
document.querySelector('header').addEventListener('touchstart', function(e){
  e.stopPropagation();
}, {passive:true});

// Touch feedback for Chrome kiosk — adds .touched class on press, removes on release
document.addEventListener('touchstart', function(e) {
  const el = e.target.closest('.option-card, .job-row, .back-btn, #start-over-btn');
  if (el) el.classList.add('touched');
}, {passive: true});
document.addEventListener('touchend', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});
document.addEventListener('touchcancel', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});

renderLocation();
</script>
</body>
</html>
