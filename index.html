<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #1B2B6B;
    --navy-dk: #131f50;
    --blue:    #2D7CC7;
    --blue-lt: #E8F2FB;
    --sky:     #5BB3E4;
    --white:   #FFFFFF;
    --cream:   #F4F7FB;
    --ink:     #1B2B6B;
    --muted:   #6B7A99;
    --border:  #D1DCEE;
    --radius:  16px;
    --shadow:  0 4px 32px rgba(27,43,107,.13);
    --btn-h:   72px;
  }

  html, body {
    height: 100%;
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--navy);
    padding: 0 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 88px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo img {
    height: 44px;
    width: auto;
    display: block;
  }
  header .tagline {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sky);
  }

  /* Stepbar */
  #stepbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 56px;
    height: 54px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 13px;
  }
  .crumb {
    color: var(--muted);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .crumb:hover { background: var(--blue-lt); color: var(--blue); }
  .crumb.active { color: var(--navy); font-weight: 700; }
  .crumb-sep { color: var(--border); }

  /* Content */
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 44px 56px calc(var(--btn-h) + 24px);
    scroll-behavior: smooth;
  }

  .screen-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
    color: var(--navy);
    letter-spacing: -.5px;
  }
  .screen-subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 36px;
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card-grid.centered {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
  }
  .card-grid.centered .option-card {
    width: 280px;
    flex-shrink: 0;
  }
  .option-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .option-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--blue);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform .25s ease;
  }
  .option-card:hover, .option-card:active, .option-card.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-3px); }
  .option-card:hover::before, .option-card:active::before, .option-card.touched::before { transform: scaleY(1); }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon svg { width: 24px; height: 24px; stroke: var(--blue); fill: none; }
  .card-icon svg[viewBox="0 0 506 506"] { stroke: none; fill: var(--blue); width: 28px; height: 28px; }
  .card-icon:has(svg[viewBox="0 0 506 506"]) { background: var(--blue-lt); }
  .card-label { font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--navy); }
  .card-meta { font-size: 13px; color: var(--muted); font-weight: 500; }
  .card-arrow {
    margin-top: auto;
    width: 32px; height: 32px;
    background: var(--blue-lt);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .option-card:hover .card-arrow, .option-card:active .card-arrow, .option-card.touched .card-arrow { background: var(--blue); }
  .card-arrow svg { width: 16px; height: 16px; stroke: var(--blue); transition: stroke .2s; }
  .option-card:hover .card-arrow svg, .option-card:active .card-arrow svg, .option-card.touched .card-arrow svg { stroke: #fff; }

  /* Job list */
  .job-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .job-row {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .job-row:hover, .job-row:active, .job-row.touched { border-color: var(--blue); box-shadow: var(--shadow); transform: translateX(4px); }
  .job-row-body { flex: 1; }
  .job-title { font-size: 19px; font-weight: 700; margin-bottom: 3px; color: var(--navy); }
  .job-clinic { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .job-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .7px;
    text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
  }
  .badge-blue { background: var(--blue-lt); color: var(--blue); }
  .badge-navy { background: #E8EBF5; color: var(--navy); }
  .badge-gray { background: #F3F4F6; color: var(--muted); }

  .job-row-arrow {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--blue-lt);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
  }
  .job-row:hover .job-row-arrow, .job-row:active .job-row-arrow, .job-row.touched .job-row-arrow { background: var(--blue); }
  .job-row-arrow svg { width: 18px; height: 18px; stroke: var(--blue); transition: stroke .2s; }
  .job-row:hover .job-row-arrow svg, .job-row:active .job-row-arrow svg, .job-row.touched .job-row-arrow svg { stroke: #fff; }

  /* Detail */
  #detail-view { max-width: 1100px; margin: 0 auto; }
  .detail-body {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  .detail-body-left { flex: 1; min-width: 0; }
  .detail-body-right {
    flex-shrink: 0;
    width: 280px;
    position: sticky;
    top: 0;
  }
  .qr-card {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    color: var(--white);
    text-align: center;
  }
  .qr-card h3 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 7px; }
  .qr-card p { font-size: 13px; opacity: .75; line-height: 1.65; font-weight: 400; }
  .qr-card .qr-url { font-size: 10px; opacity: .45; word-break: break-all; font-family: monospace; }
  .detail-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 28px; }
  .detail-clinic-icon {
    width: 64px; height: 64px;
    background: var(--navy);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .detail-clinic-icon svg { width: 32px; height: 32px; stroke: #fff; fill: none; }
  .detail-clinic-icon svg[viewBox="0 0 506 506"] { fill: currentColor; stroke: none; }
  .detail-title { font-size: 32px; font-weight: 800; line-height: 1.1; margin-bottom: 4px; color: var(--navy); letter-spacing: -.5px; }
  .detail-clinic-name { font-size: 15px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }
  .detail-fact { background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .detail-fact-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .detail-fact-value { font-size: 15px; font-weight: 700; color: var(--navy); }

  .detail-section { margin-bottom: 24px; }
  .detail-section-title { font-size: 15px; text-transform: uppercase; color: #374151; font-weight: 700; margin-bottom: 10px; }
  .detail-section p { font-size: 15px; line-height: 1.75; color: #374151; font-weight: 400; }
  .desc { font-size: 15px; line-height: 1.75; color: #374151; }
  .desc-sec { margin-top: 18px; }
  .desc-sec strong { display: block; font-size: 15px; color: #374151; font-weight: 700; margin-bottom: 6px; }
  .desc-sec:has(.desc-body:empty) { display: none; }

  /* QR */
  .qr-section {
    background: var(--navy);
    border-radius: var(--radius);
    padding: 32px 36px;
    display: flex; align-items: center; gap: 36px;
    margin-top: 36px; color: var(--white);
  }
  #qr-canvas { background: #fff; border-radius: 10px; padding: 10px; flex-shrink: 0; }
  #qr-canvas img, #qr-canvas canvas { display: block; }
  .qr-text h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.3px; }
  .qr-text p { font-size: 14px; opacity: .75; line-height: 1.65; max-width: 320px; font-weight: 400; }
  .qr-url { margin-top: 14px; font-size: 11px; opacity: .5; word-break: break-all; font-family: monospace; }

  /* Back button */
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 2px solid var(--border);
    padding: 10px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
    margin-bottom: 32px;
    font-family: 'Montserrat', sans-serif;
    color: var(--navy); letter-spacing: .3px;
  }
  .back-btn:hover, .back-btn:active, .back-btn.touched { border-color: var(--blue); background: var(--blue-lt); color: var(--blue); }
  .back-btn svg { width: 15px; height: 15px; stroke: currentColor; }

  /* Sticky Start Over bar */
  #start-over-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--btn-h);
    background: var(--white);
    border-top: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #start-over-btn {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 0 56px;
    height: 48px;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background .2s, transform .1s;
  }
  #start-over-btn:hover, #start-over-btn:active, #start-over-btn.touched { background: var(--blue); transform: scale(1.02); }
  #start-over-btn:active { transform: scale(.98); }
  #start-over-btn svg { width: 15px; height: 15px; stroke: #fff; }

  /* Idle screen */
  #idle-overlay {
    position: fixed; inset: 0; z-index: 100;
    background-image: url('bg.webp');
    background-size: cover;
    background-position: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; cursor: pointer;
    transition: opacity .4s;
  }
  #idle-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--navy);
    opacity: 0.8;
    z-index: 0;
  }
  #idle-overlay > * { position: relative; z-index: 1; }
  #idle-overlay > .idle-logo { position: absolute; top: 0; left: 0; right: 0; z-index: 102; }
  #idle-overlay.hidden { opacity: 0; pointer-events: none; }
  .idle-logo { width: 100%; padding: 32px 32px 0; display: flex; justify-content: center; }
  .idle-logo img { height: 100px; display: block; }
  .idle-tagline { font-size: 26px; color: var(--sky); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-top: 40px; text-align: center; }
  .idle-kiosk-title { display: block; font-size: 100px; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1.1; margin-bottom: 12px; text-transform: none; letter-spacing: -.5px; }
  .idle-cta {
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.3);
    color: #fff;
    padding: 18px 52px;
    border-radius: 50px;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    animation: pulse 2.5s ease-in-out infinite;
    text-transform: uppercase;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:1; }
    50% { transform: scale(1.03); opacity:.8; }
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .anim { animation: fadeUp .3s ease both; }
  .anim-d1 { animation-delay: .05s; }
  .anim-d2 { animation-delay: .10s; }
  .anim-d3 { animation-delay: .15s; }
  .anim-d4 { animation-delay: .20s; }
  .anim-d5 { animation-delay: .25s; }

  #content::-webkit-scrollbar { width: 5px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Mobile (max 767px) ── */
  @media (max-width: 767px) {
    html, body { overflow: auto; }
    #app { height: auto; min-height: 100vh; overflow: visible; }

    header {
      padding: 0 20px;
      height: 64px;
    }
    .logo img { height: 32px; }
    header .tagline { font-size: 10px; letter-spacing: 1.5px; }

    #stepbar {
      padding: 0 20px;
      height: auto;
      min-height: 44px;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 8px;
      padding-bottom: 8px;
      font-size: 12px;
    }

    #content {
      padding: 24px 20px calc(var(--btn-h) + 20px);
      overflow-y: visible;
      flex: none;
    }

    .screen-title { font-size: 24px; }
    .screen-subtitle { font-size: 13px; margin-bottom: 24px; }

    .card-grid {
      grid-template-columns: 1fr;
    }
    .card-grid.centered {
      flex-direction: column;
      align-items: stretch;
    }
    .card-grid.centered .option-card {
      width: 100%;
    }

    .job-list {
      grid-template-columns: 1fr;
    }
    .job-row { padding: 16px 18px; }
    .job-title { font-size: 16px; }

    .detail-body {
      flex-direction: column;
      gap: 24px;
    }
    .detail-body-right {
      width: 100%;
      position: static;
    }
    .detail-title { font-size: 22px; }
    .detail-header { gap: 14px; }
    .detail-clinic-icon { width: 48px; height: 48px; border-radius: 10px; }
    .detail-clinic-icon svg { width: 24px; height: 24px; }

    .detail-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    #start-over-btn { padding: 0 32px; font-size: 12px; }

    #idle-overlay { justify-content: center; }
    .idle-logo { padding: 24px 32px 0; }
    .idle-logo img { max-width: 280px; height: 80px; width: auto; }
    .idle-tagline .interpunct { display: none; }
    .idle-tagline { margin-top: 0; }
    .idle-kiosk-title { font-size: 40px; margin-bottom: 8px; }
    #idle-overlay .idle-cta { font-size: 13px; padding: 14px 32px; width: auto; text-align: center; max-width: 280px; line-height: 1.5; position: fixed !important; bottom: 40px; left: 0; right: 0; margin: 0 auto; z-index: 103; }
  }

  /* ── Desktop (1024px+) ── */
  @media (min-width: 1024px) {
    .idle-logo img { height: 130px; }
    .idle-kiosk-title { font-size: 135px; }
  }
</style>
</head>

nt before and after procedures to maintain infection control standards.<br>&bull; Assist dentists during various dental treatments by handing instruments, suctioning, and ensuring patient comfort.<br>&bull; Manage patient records, including updating medical histories and documenting treatment details accurately.</div></div><div class=\"desc-sec\"><strong>SCHEDULE</strong><div class=\"desc-body\">patient appointments and coordinate with other staff to optimize clinic workflow. Provide patients with oral health education and post-operative care instructions to support recovery and prevention. Skills: The Certified Dental Assistant utilizes technical skills daily to prepare and maintain dental instruments and equipment, ensuring compliance with health and safety regulations. Strong organizational skills are essential for managing patient records and scheduling appointments efficiently, which supports the smooth operation of the dental practice. Effective communication skills are employed to educate patients on oral hygiene and to provide reassurance during procedures, enhancing patient experience and care outcomes. The ability to work collaboratively with dentists, hygienists, and administrative staff fosters a cohesive team environment. Additionally, proficiency with dental software and electronic health records enables accurate documentation and streamlined workflow management. Open role for an existing vacancy</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200901834423_1&source=CC3"},
  {posting:12608,clinic:"",title:"Infrastructure Architect",category:"Information Technology",status:"FT",city:"Toronto",province:"ON",salary:"150000.00 To 175000.00 (CAD) Annually",date:"November 12, 2026",description:"Job Title: Infrastructure Architect Team: Technology Services (Information Technology) Reports To: Senior Infrastructure Engineering Manager Location: Toronto, Ontario. (4 days in office, 1 day remote)<div class=\"desc-sec\"><strong>EMPLOYMENT TYPE</strong><div class=\"desc-body\">Permanent Full-Time</div></div><div class=\"desc-sec\"><strong>ABOUT 123DENTIST</strong><div class=\"desc-body\">123Dentist is the largest majority Canadian-owned dental support organization, supporting a growing network of 400+ dental practices across the country. As we continue to expand, both organically and through acquisition, our IT team plays a central role in standardizing, securing, and scaling the technology that our clinics and corporate teams rely on every day.</div></div><div class=\"desc-sec\"><strong>ABOUT THE ROLE</strong><div class=\"desc-body\">The Infrastructure Architect is the senior technical engineer for 123Dentist’s server, identity, cloud, and network infrastructure, combining deep hands-on design and engineering with escalation support and project delivery across a Microsoft-centric, multi-site environment. The role is balanced across three areas: infrastructure transformation and project delivery (cloud migrations, identity modernization, endpoint-management standardization), Tier 2/3 escalation support for the most complex infrastructure, identity, cloud, and network issues, and mergers &amp; acquisitions / practice integration, onboarding newly acquired practices into the 123Dentist environment. Operating with significant independence, you’ll act as a trusted technical authority, mentoring infrastructure engineers, service desk analysts, and operations team members while championing sound engineering standards, security, and reliability.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Serve as the Tier 2/3 escalation point for complex infrastructure, identity, cloud, and network incidents, driving them through to root-cause resolution<br>&bull; Diagnose and resolve advanced issues across Windows<br>&bull; Server, Active<br>&bull; Directory, Entra<br>&bull; ID, Microsoft<br>&bull; Intune, Microsoft 365,<br>&bull; Azure, and the LAN/WAN and firewall layers<br>&bull; Lead major-incident response for infrastructure-impacting outages, coordinating with IT and business stakeholders and communicating status clearly to leadership<br>&bull; Mentor and coach<br>&bull; Tier 1 and Tier 2 analysts, producing runbooks and technical documentation that build the team’s troubleshooting capability<br>&bull; Independently design, plan, and deliver infrastructure transformation initiatives across on-premises and cloud, including server consolidation, migrations, identity modernization, endpoint-management standardization, and network refreshes<br>&bull; Engineer and administer<br>&bull; Microsoft Azure infrastructure, including landing zone design, virtual machines, networking, storage, backup, and cost optimization<br>&bull; Lead hybrid identity initiatives spanning on-premises<br>&bull; Active Directory and Entra<br>&bull; ID, including conditional access,<br>&bull; MFA, and RBAC<br>&bull; Modernize and standardize endpoint management through Microsoft<br>&bull; Intune, and automate provisioning and configuration using<br>&bull; PowerShell and infrastructure-as-code<br>&bull; Lead the technical engineering workstream to integrate newly acquired practices into the 123Dentist environment, including identity, endpoints, network, and core systems<br>&bull; Partner with IT leadership and the Corporate<br>&bull; Development /<br>&bull; M&amp;A team on due-diligence and integration planning, standardizing and securing clinic infrastructure as new sites join the network</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bull; Bachelor’s degree in Information<br>&bull; Technology, Computer<br>&bull; Science, or a related field, or equivalent hands-on experience 7–8+ years in systems/infrastructure engineering or senior systems administration, including hands-on<br>&bull; Tier 2/3 escalation in a Microsoft-centric enterprise environment<br>&bull; Demonstrated experience independently leading infrastructure transformation projects spanning multiple teams or departments (cloud adoption/migrations, identity or endpoint modernization, network refreshes)<br>&bull; Experience supporting a multi-site, distributed environment (healthcare, DSO, retail, or similar) is an asset; experience with M&amp;A / site integration is a strong asset<br>&bull; Expert-level<br>&bull; Windows Server administration and deep hybrid identity expertise (on-premises Active Directory and Entra ID, conditional access, MFA, RBAC)<br>&bull; Strong Microsoft<br>&bull; Azure engineering skills, including IaaS, virtual networking, storage, backup, security, and cost management<br>&bull; Experience with Microsoft<br>&bull; Intune / modern endpoint management and LAN/WAN and network engineering (routing, VLANs, VPN, DNS/DHCP, firewalls)<br>&bull; PowerShell scripting and automation experience, with working familiarity in endpoint security, backup/DR, and ITSM tooling<br>&bull; Microsoft certifications (e.g., AZ-104/AZ-305, MD-102, SC-300) or equivalent networking/security certifications (CCNA, Security+, ITIL) are an asset<br>&bull; Strong sense of ownership, excellent analytical and problem-solving abilities, and a collaborative approach to mentoring across teams</div></div><div class=\"desc-sec\"><strong>WHY JOIN 123DENTIST</strong><div class=\"desc-body\">? Play a central, high-visibility role in modernizing IT infrastructure for a fast-growing national organization Operate with real autonomy as a trusted senior technical authority Work across a modern, cutting-edge cloud, identity, and endpoint technology stack Be part of a collaborative team that values mentorship and engineering excellence</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200901834812_1&source=CC3"},

 IT team.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Lead the clinic<br>&bull; IT support function end-to-end – clinic support,<br>&bull; Tier 1 triage/dispatch, and Tier 2 helpdesk – accountable for service quality, responsiveness, and SLA performance across the national clinic network<br>&bull; Line-manage, coach, and develop direct reports, building a high-performing, service-oriented organization with clear career pathways<br>&bull; Establish robust escalation paths, major-incident management, and stakeholder communication for clinic-impacting issues<br>&bull; Establish and mature the systems, processes, and ITSM tooling that underpin clinic support, including queues, workflows, knowledge base, self-service, and automation<br>&bull; Design and deliver meaningful reporting and metrics (ticket volume, response and resolution times, SLA attainment, CSAT) to drive data-led decisions and improvement<br>&bull; Lead problem management and continuous service improvement to remove recurring issues and raise first-contact resolution<br>&bull; Drive a controlled transition toward corporate ownership of clinic<br>&bull; IT operations, insourcing capabilities where it improves quality, control, or cost, and manage<br>&bull; MSP performance against<br>&bull; SLAs and KPIs<br>&bull; Standardize tools, processes, and configurations across clinics to reduce variation and enable the organization to scale<br>&bull; Contribute to and deliver the clinic<br>&bull; IT support roadmap aligned to 123Dentist’s growth, and build strong relationships with Clinic<br>&bull; Managers, Regional<br>&bull; Managers, and VPs of Operations<br>&bull; Manage the function’s budget and resources, and support the standardized onboarding of newly acquired practices into the clinic support model</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bull; Bachelor’s degree in Information<br>&bull; Technology, Busi , and consistency.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Create, maintain, and monitor the health of paid media accounts across Google,<br>&bull; Meta, and new channels, and set standards for account structure, naming conventions, and tracking across the network<br>&bull; Conduct keyword, audience, and website research, and optimize targeting, bidding, and campaigns using bid management tools, automated bidding strategies, and data modeling<br>&bull; Make strategic campaign and budget allocation recommendations to maximize the effectiveness of existing campaigns<br>&bull; Lead the evaluation, business case, and onboarding of new paid media programs and vendors, including paid social, programmatic display, video, and connected<br>&bull; TV Design and run structured tests of local and hyper-local paid programs, with clear hypotheses and success criteria<br>&bull; Recommend media mix and budget allocation across channels, using incrementality testing and performance data to shift investment toward the highest-return programs<br>&bull; Design, build, and maintain<br>&bull; AI-assisted workflows (e.g. LLM tools, agents, Google Ads scripts) that automate account audits, search term mining, budget pacing, reporting, and campaign build-outs across hundreds of accounts<br>&bull; Document and share workflows with the team, measure the time saved and quality gained, and keep human review and our data privacy, patient information, and responsible<br>&bull; AI guidelines in place<br>&bull; Monitor campaign results and tie cross-channel performance to patient acquisition outcomes such as calls, bookings, and new patients<br>&bull; Collaborate with Regional<br>&bull; Marketing, Creative,<br>&bull; Analytics, and external agencies and media partners, and provide paid media input on clinic reports, budget planning, and forecasting</div></div><div class=\"desc-sec\"><strong>WHAT YOU BRING</strong><div class=\"desc-body\">&bu   {posting:13003,clinic:"",title:"Senior Talent Acquisition Advisor",category:"Human Resources",status:"FT",city:"Burnaby",province:"BC",salary:"80000.00 To 95000.00 (CAD) Annually",date:"November 12, 2026",description:"Job Title: Senior Talent Acquisition Advisor Team: Talent Acquisition Location: Burnaby, BC - 1 day per week in the office<div class=\"desc-sec\"><strong>EMPLOYMENT TYPE</strong><div class=\"desc-body\">Permanent Full-Time</div></div><div class=\"desc-sec\"><strong>ABOUT 123DENTIST</strong><div class=\"desc-body\">At 123Dentist, we are one of Canada’s largest and fastest-growing dental support organizations, supporting more than 500 clinics and 10,000 team members across the country. Our Talent Acquisition team plays a key role in enabling that growth by attracting and hiring top talent across our clinic network.</div></div><div class=\"desc-sec\"><strong>ABOUT THE ROLE</strong><div class=\"desc-body\">We’re looking for a Senior Talent Acquisition Advisor to lead full-cycle recruitment of certified dental assistants (CDAs) across our network of clinics. This role combines hands-on recruitment delivery with strategic partnership, requiring someone who can manage high-volume hiring while building strong relationships with clinic leaders and driving proactive sourcing strategies. You’ll operate as a trusted partner to the business, supporting clinic hiring needs while helping to strengthen recruitment practices and processes.</div></div><div class=\"desc-sec\"><strong>WHAT YOU’LL DO</strong><div class=\"desc-body\">&bull; Manage end-to-end recruitment across a portfolio of roles, primarily certified dental assistants (CDAs), from intake through to offer<br>&bull; Partner with hiring managers to develop strategic hiring plans aligned with business needs<br>&bull; Build and execute proactive sourcing strategies, including direct sourcing for hard-to-fill roles<br>&bull; Develop and maintain candidate pipelines using<br>&bull; ATS and recruitment tools<br> entive care. Assist with general administrative duties, including filing, scanning, and patient correspondence. Maintain patient confidentiality and collaborate with the dental team to ensure excellent patient care.</div></div><div class=\"desc-sec\"><strong>QUALIFICATIONS</strong><div class=\"desc-body\">&bull; and Skills Minimum of 3 years of dental office experience, preferably in reception, front desk administration, or recare coordination.<br>&bull; Strong knowledge of dental office procedures, hygiene recare, scheduling, and treatment follow-ups.<br>&bull; Proficiency in dental practice management software.<br>&bull; Experience with patient payments, dental insurance claims, predeterminations, and billing inquiries.<br>&bull; Knowledge of dental terminology, hygiene procedures, and Ontario dental insurance processes.<br>&bull; Excellent verbal and written communication skills with a professional, patient-focused approach.<br>&bull; Strong organizational skills, attention to detail, and ability to multitask in a fast-paced environment.<br>&bull; Comfortable making outbound calls and proactively following up with patients.<br>&bull; Excellent customer service, interpersonal, and problem-solving skills.<br>&bull; Ability to maintain accurate records and protect confidential patient information in accordance with applicable privacy legislation.<br>&bull; Reliable, proactive, and self-motivated, with the ability to work independently and as part of a team.</div></div><div class=\"desc-sec\"><strong>SCHEDULE</strong><div class=\"desc-body\">Monday, Tuesday and Thursday- 8:45am-6:15pm Wednesday - 8:45am-5:15pm Alternating Saturdays 8:45am-2:15pm</div></div><div class=\"desc-sec\"><strong>WHAT WE OFFER</strong><div class=\"desc-body\">A friendly, supportive, and collaborative team environment. Competitive compensation based on experience. A positive workplace that values patient care, teamwork, and work-life balance. Join our team at Springdale Dental Centre to delive   {posting:13072,clinic:"",title:"Dental Receptionist",category:"Reception - Clinic",status:"FT",city:"Ottawa",province:"ON",salary:"20 To 24 (CAD) Hourly",date:"November 12, 2026",description:"Our dental practice Hampton Park Dental - Crossman located in Ottawa, Ontario are looking for a passionate, hard-working Dental Receptionist on a full-time basis. 123Dentist is Canada’s largest majority dentist-owned network of dental practices, with almost 500 locations nationwide and nearly 8,000 employees. Providing a long-term career in a growing network located in multiple communities across the country, at all levels of the industry.<div class=\"desc-sec\"><strong>WHAT WE ARE OFFERING</strong><div class=\"desc-body\">&bull; Full-time permanent position<br>&bull; Group benefits offered<br>&bull; State-of-the-art technologies/equipment such as itero and cerec lasers<br>&bull; Monthly luncheons<br>&bull; Free parking available<br>&bull; Transit accessible<br>&bull; Continuing education incentives/tuition reimbursement<br>&bull; Opportunity for professional advancement<br>&bull; Team building activities<br>&bull; Recognition through our monthly Ambassador program<br>&bull; Mentorship and training from highly skilled, experienced dental professionals; a great opportunity to grow and excel<br>&bull; Collaborative team and environment to help you succeed as a Dental Receptionist</div></div><div class=\"desc-sec\"><strong>SCHEDULE</strong><div class=\"desc-body\">Monday to Friday with 1 evening No weekends!</div></div><div class=\"desc-sec\"><strong>WHAT WE ARE LOOKING FOR</strong><div class=\"desc-body\">&bull; Diploma in Dental Administration /<br>&bull; Reception is an asset<br>&bull; Prior experience in Dentistry is a plus, but we are willing to accept<br>&bull; New Grads Demonstrated ability to communicate effectively with patients and families<br>&bull; Customer service mindset 123Dentist is an equal opportunity employer committed to diversity and inclusivity.<br>&bull; The organization strives to build a workforce that reflects the communities it serves, including individuals with disabilities.<br>&bull; Accommodations are available upon request throughout the recruitment process.<br>&bull; Please inform our team if you need assistance at any stage.<br>&bull; Open role for an existing vacancy<br>&bull; Job ID: 13072</div></div>",url:"https://workforcenow.adp.com/mascsr/default/mdf/recruitment/recruitment.html?cid=c2a72bdd-3357-40d4-ba1b-c98aada9201f&ccId=9200523617456_2&type=JS&lang=en_CA&jobId=9200914485699_688&source=CC3"}
];

const STATUS_LABELS = { FT:"Full-Time", PT:"Part-Time", "FT/PT":"Full-Time / Part-Time", "Temp FT":"Temp Full-Time", "Temp PT":"Temp Part-Time", "Temp FT/PT":"Temp Full-Time / Part-Time", Locum:"Locum", Casual:"Casual", "PT 20+":"PT (20+ hrs/wk)", "PT <20":"PT (<20 hrs/wk)" };
const PROVINCE_NAMES = { ON:"Ontario", QC:"Quebec", BC:"British Columbia", AB:"Alberta", MB:"Manitoba", SK:"Saskatchewan", NS:"Nova Scotia", NB:"New Brunswick", NL:"Newfoundland", PE:"Prince Edward Island" };

const locationMap = {};
RAW_JOBS.forEach(j => {
  const key = j.province;
  if (!locationMap[key]) locationMap[key] = { province: j.province, jobs: [] };
  locationMap[key].jobs.push(j);
});

let state = { step:'location', location:null, category:null };

const iconPin = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

8 185.424011 C 167.598999 184.960999 173.904007 185.161987 180.218002 185.942017 C 186.533005 186.721008 192.703995 188.049011 198.766998 190.059021 C 204.811996 192.001007 210.576996 194.526978 216.197998 197.601013 L 203.703995 220.13501 C 199.612 217.886993 195.322006 215.984009 190.802002 214.578003 C 186.350006 213.153992 181.785995 212.122986 177.059006 211.572021 C 172.399994 211.002991 167.714005 210.877014 163.001999 211.194 C 158.289993 211.510986 153.705002 212.302979 149.160995 213.52002 C 144.617004 214.737 140.25 216.343018 136.011002 218.423004 C 131.770996 220.502991 127.776001 222.953979 124.026001 225.776001 C 120.276001 228.596985 116.837997 231.770996 113.626999 235.247986 C 110.484001 238.705994 107.721001 242.498993 105.234001 246.507996 L 83.141998 233.237 L 83.277603 233.200989 Z M 187.384995 9.587097 C 52.633598 45.67749 -27.405899 183.912994 8.62372 318.317993 C 44.6534 452.721985 183.136002 532.504028 317.888 496.412994 C 452.639008 460.322998 532.677979 322.087006 496.631012 187.61499 C 460.583008 53.1427 322.135986 -26.503296 187.384995 9.587097 Z"/></svg>`;
const iconChevron = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
const iconArrowLeft = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`;

function updateBreadcrumb() {
  const cL=document.getElementById('crumb-location'), cC=document.getElementById('crumb-category'), cJ=document.getElementById('crumb-job');
  const s1=document.getElementById('sep1'), s2=document.getElementById('sep2');
  cL.className='crumb'+(state.step==='location'?' active':'');
  if(state.location){
    s1.style.display=''; cC.style.display='';
    cC.textContent=`${PROVINCE_NAMES[state.location.province]||state.location.province}`;
    cC.className='crumb'+(state.step==='category'?' active':'');
    cC.onclick=()=>renderCategory();
  } else { s1.style.display='none'; cC.style.display='none'; }
  if(state.category){
    s2.style.display=''; cJ.style.display='';
    cJ.textContent=state.category;
    cJ.className='crumb'+(state.step==='jobs'?' active':'');
    cJ.onclick=()=>renderJobs();
  } else { s2.style.display='none'; cJ.style.display='none'; }
}

function renderLocation() {
  state={step:'location',location:null,category:null};
  updateBreadcrumb();
  gtag('event', 'search_started', { event_category: 'Kiosk', event_label: 'Where would you like to work?' });
  const locations=Object.values(locationMap).sort((a,b)=>(PROVINCE_NAMES[a.province]||a.province).localeCompare(PROVINCE_NAMES[b.province]||b.province));
  const c=document.getElementById('content');
  c.scrollTop=0;
  c.innerHTML=`
    <div class="anim"><div class="screen-title">Where would you like to work?</div><div class="screen-subtitle">Select a province to explore available positions.</div></div>
    <div class="card-grid">
      ${locations.map((loc,i)=>`
        <div class="option-card anim anim-d${Math.min(i+1,5)}" onclick="selectLocation('${loc.province}')">
          <div class="card-icon">${iconPin}</div>
          <div class="card-label">${PROVINCE_NAMES[loc.province]||loc.province}</div>
          <div class="card-meta">${loc.jobs.length} opening${loc.jobs.length!==1?'s':''}</div>
          <div class="card-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function selectLocation(key){
  state.location=locationMap[key];
  gtag('event', 'province_selected', { event_category: 'Kiosk', event_label: PROVINCE_NAMES[key] || key });
  renderCategory();
}

function renderCategory() {
  state.step='category'; state.category=null;
  updateBreadcrumb();
  const cats={};
  state.location.jobs.forEach(j=>{ const c=j.category.trim(); if(!cats[c])cats[c]=0; cats[c]++; });
  const catIcon=c=>(['Associate Dentist','Hygienist','Dental Assistant','Dental Specialist'].includes(c))?iconHospital:iconBriefcase;
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderLocation()">${iconArrowLeft} All Provinces</button>
    <div class="anim anim-d1"><div class="screen-title">What type of role?</div><div class="screen-subtitle">Positions in <strong>${PROVINCE_NAMES[state.location.province]||state.location.province}</strong></div></div>
    <div class="card-grid centered">
      ${Object.entries(cats).map(([cat,count],i)=>`
        <div class="option-card anim anim-d${Math.min(i+2,5)}" onclick="selectCategory('${cat.replace(/'/g,"\\'")}')">
          <div class="card-icon">${catIcon(cat)}</div>
          <div class="card-label">${cat}</div>
          <div class="card-meta">${count} opening${count!==1?'s':''}</div>
          <div class="card-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function selectCategory(cat){
  state.category=cat;
  gtag('event', 'role_type_selected', { event_category: 'Kiosk', event_label: cat });
  renderJobs();
}

function renderJobs() {
  state.step='jobs';
  updateBreadcrumb();
  const jobs=state.location.jobs.filter(j=>j.category.trim()===state.category.trim());
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderCategory()">${iconArrowLeft} Back</button>
    <div class="anim anim-d1"><div class="screen-title">${state.category}</div><div class="screen-subtitle">${jobs.length} opening${jobs.length!==1?'s':''} in ${PROVINCE_NAMES[state.location.province]||state.location.province}</div></div>
    <div class="job-list">
      ${jobs.map((job,i)=>`
        <div class="job-row anim anim-d${Math.min(i+2,5)}" onclick="renderJobDetail(${RAW_JOBS.indexOf(job)})">
          <div class="job-row-body">
            <div class="job-title">${job.title}</div>
            <div class="job-clinic">${job.clinic}</div>
            <div class="job-badges">
              ${job.status?`<span class="badge badge-blue">${STATUS_LABELS[job.status]||job.status}</span>`:''}
              <span class="badge badge-navy">${job.city}, ${job.province}</span>
            </div>
          </div>
          <div class="job-row-arrow">${iconChevron}</div>
        </div>`).join('')}
    </div>`;
}

function renderJobDetail(idx) {
  const job=RAW_JOBS[idx];
  gtag('event', 'job_viewed', { event_category: 'Kiosk', event_label: `${job.title} – ${job.clinic}`, job_title: job.title, clinic: job.clinic, province: job.province, posting: job.posting });
  state.step='detail';
  updateBreadcrumb();
  const ct=document.getElementById('content');
  ct.scrollTop=0;
  ct.innerHTML=`
    <button class="back-btn anim" onclick="renderJobs()">${iconArrowLeft} Back to Listings</button>
    <div id="detail-view">
      <div class="detail-header anim">
        <div class="detail-clinic-icon">${['Associate Dentist','Hygienist','Dental Assistant','Dental Specialist'].includes(job.category.trim()) ? iconHospital : iconBriefcase}</div>
        <div>
          <div class="detail-title">${job.title} – ${job.clinic}</div>
          <div class="job-badges">
            ${job.status?`<span class="badge badge-blue">${STATUS_LABELS[job.status]||job.status}</span>`:''}
            <span class="badge badge-navy">Posting #${job.posting}</span>
          </div>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-body-left">
          <div class="detail-grid anim anim-d1">
            <div class="detail-fact"><div class="detail-fact-label">Location</div><div class="detail-fact-value">${job.city}, ${job.province}</div></div>
            ${job.status?`<div class="detail-fact"><div class="detail-fact-label">Employment Type</div><div class="detail-fact-value">${STATUS_LABELS[job.status]||job.status}</div></div>`:''}
            ${job.salary?`<div class="detail-fact"><div class="detail-fact-label">Salary</div><div class="detail-fact-value">${job.salary}</div></div>`:''}
            <div class="detail-fact"><div class="detail-fact-label">Category</div><div class="detail-fact-value">${job.category.trim()}</div></div>
          </div>
          ${job.description ? `<div class="detail-section anim anim-d2">
            <div class="detail-section-title">About this role</div>
            <div class="desc">${job.description}</div>
          </div>` : ''}
        </div>
        <div class="detail-body-right anim anim-d2">
          <div class="qr-card">
            <div id="qr-canvas"></div>
            <div>
              <h3>Apply for this position</h3>
              <p>Scan with your phone to view the full listing and submit your application.</p>
              <div class="qr-url">${job.url}</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{
    new QRCode(document.getElementById("qr-canvas"),{
      text:job.url, width:160, height:160,
      colorDark:"#1B2B6B", colorLight:"#ffffff",
      correctLevel:QRCode.CorrectLevel.M
    });
  },50);
}

function goHome(){ renderLocation(); }
function startOver(){ renderLocation(); }
function showIdle(){ renderLocation(); idle.classList.remove('hidden'); }

const idle=document.getElementById('idle-overlay');
idle.addEventListener('click',()=>{ idle.classList.add('hidden'); resetIdleTimer(); });

let idleTimer;
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ renderLocation(); },90000);
}
['touchstart','click','mousemove','keydown'].forEach(e=>{
  document.addEventListener(e,resetIdleTimer,{passive:true});
});
resetIdleTimer();

// Header tap → go to idle screen
document.querySelector('header').addEventListener('click', function(e){
  e.stopPropagation();
  renderLocation();
  idle.classList.remove('hidden');
});
document.querySelector('header').addEventListener('touchstart', function(e){
  e.stopPropagation();
}, {passive:true});

// Touch feedback for Chrome kiosk — adds .touched class on press, removes on release
document.addEventListener('touchstart', function(e) {
  const el = e.target.closest('.option-card, .job-row, .back-btn, #start-over-btn');
  if (el) el.classList.add('touched');
}, {passive: true});
document.addEventListener('touchend', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});
document.addEventListener('touchcancel', function(e) {
  document.querySelectorAll('.touched').forEach(el => el.classList.remove('touched'));
}, {passive: true});

renderLocation();
</script>
